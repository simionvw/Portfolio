<!DOCTYPE html>
<html lang="en">
  <head>

    <section class="section1">

      </container>

    <section class="section2">

    <footer>
      <img class="logo" src="https://placehold.co/40?text=*&font=oswald" alt="placeholder logo 40x40 star shape">

      <button class="contact">Contact Me</button>
    </footer>
