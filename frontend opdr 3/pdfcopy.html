<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>flexbox portfolio</title>
    <style>
      body{
  font-family: Arial, sans-serif;
  margin:0;
  padding:0;
  box-sizing:border-box;
}
p {
  color: rgb(77, 77, 77);
}

.navbar {
  height: 60px;
  background-color: rgb(200, 200, 200);
  display: flex;
  align-items: center;
}

.logo {
  margin-left: 10px;
}

.contact {
  background: rgb(155, 155, 155);
  color: black;
  text-decoration: none;
  width: 100px;
  height: 30px;
  border-radius: 20px;
  border: 2px solid rgb(77, 77, 77);
  margin-left: auto;
  margin-right: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.section1{
  display: flex;
  align-items:center;
  justify-content:space-evenly;
  padding:40px;
}

.text1{
  max-width:500px;
  margin-bottom: 100px;
}

.image1{
  border-radius:15px;
  max-width:400px;
  width:100%;
}

.section2{
  flex-direction: column;
  display: flex;
  align-items:center;
  justify-content:center;
  background-color: rgb(200, 200, 200);
  padding-bottom: 20px;
}

.text2{
  max-width:500px;
  margin-bottom: 10px;
  text-align: center;
}

.image2{
  border-radius:15px;
  max-width:500px;
  width:100%;
}

.projects{
  text-align:center;
  padding:40px;
}

.row{
  display:flex;
  justify-content:space-evenly;
  margin-top:20px;
  flex-wrap:wrap;
}

.card{
  display:flex;
  flex-direction:column;
  align-items:flex-start;
}
footer {
  height: 60px;
  background-color: rgb(200, 200, 200);
  display: flex;
  align-items: center;
}

.footertext1 {
  padding-left: 10px;
}

.footertext2 {
  padding-left: 100px;
  color: rgb(77, 77, 77);
}
    </style>
  </head>
  
  <body>
    <nav class="navbar">
      <img class="logo" src="https://placehold.co/40?text=*&font=oswald">
      <button class="contact">Contact Me</button>
    </nav>

    <section class="section1">

      <div class="text1">
        <h1>My portfolio</h1>
        <p class="p1" >This is my portfolio, this is where you will find my creations.</p>
      </div>

      <img src="https://placehold.co/400x300" class="image1">
    </section>

    <section class="section2">
      <div class="text2">
        <h1>My portfolio</h1>
        <p class="p1" >This is my portfolio, this is where you will find my creations.</p>
      </div>
      <img src="https://placehold.co/500x300" class="image2">
    </section>

    <section class="projects">
        <h1>My projects</h1>

        <div class="row">
          <div class="card">
            <img src="https://placehold.co/400x300" class="image1">
            <p>Project1</p>
          </div>
          <div class="card">
            <img src="https://placehold.co/400x300" class="image1">
            <p>Project2</p>
          </div>
        </div>

        <div class="row">
          <div class="card">
            <img src="https://placehold.co/400x300" class="image1">
            <p>Project3</p>
          </div>
          <div class="card">
            <img src="https://placehold.co/400x300" class="image1">
            <p>Project4</p>
          </div>
        </div>

    </section>

    <footer>
      <img class="logo" src="https://placehold.co/40?text=*&font=oswald">
      <h3 class="footertext1">Simon van Wegen</h3>
      <h3 class="footertext2">Portfolio voor Techniek College Rotterdam</h3>
      <button class="contact">Contact Me</button>
    </footer>
  </body>
</html>
