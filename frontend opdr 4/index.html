<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>flexbox portfolio</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <nav class="navbar">
      <img class="logo" src="https://placehold.co/40?text=*&font=oswald" alt="placeholder logo 40x40 star shape">
      <button class="contact">Contact Me</button>
    </nav>

    <section class="section1">

      <div class="text1">
        <h1>My portfolio</h1>
        <p class="p1" >This is my portfolio, this is where you will find my creations.</p>
      </div>

      <img src="https://placehold.co/400x300" class="image1" alt="placeholder image 400x300">
    </section>

    <section class="section2">
      <div class="text2">
        <h1>My portfolio</h1>
        <p class="p1" >This is my portfolio, this is where you will find my creations.</p>
      </div>
      <img src="https://placehold.co/500x300" class="image2" alt="placeholder image 500x300">
    </section>

    <section class="projects">
        <h1>My projects</h1>

        <div class="row">
          <div class="card">
            <img src="https://placehold.co/400x300" class="image1" alt="placeholder image 400x300">
            <p>Project1</p>
          </div>
          <div class="card">
            <img src="https://placehold.co/400x300" class="image1" alt="placeholder image 400x300">
            <p>Project2</p>
          </div>
        </div>

        <div class="row">
          <div class="card">
            <img src="https://placehold.co/400x300" class="image1" alt="placeholder image 400x300">
            <p>Project3</p>
          </div>
          <div class="card">
            <img src="https://placehold.co/400x300" class="image1" alt="placeholder image 400x300">

        </div>

    </section>

    <footer class="footer">
      <img class="logo" src="https://placehold.co/40?text=*&font=oswald" alt="placeholder logo 40x40 star shape">
      <h2 class="footertext1">Simon van Wegen</h2>
      <h3 class="footertext2">Portfolio voor Techniek College Rotterdam</h3>
      <button class="contactfooter">Contact Me</button>
    </footer>
  </body>
</html>

<script>

const cards = document.querySelectorAll(".card");

cards.forEach((card) => {

  card.addEventListener("mousemove", (e) => {

    const rect = card.getBoundingClientRect();

    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;

    const centerX = rect.width / 2;
    const centerY = rect.height / 2;

    const rotateX = -(y - centerY) / 10;
    const rotateY = (x - centerX) / 10;

    card.style.transform =
      `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;

  });

  card.addEventListener("mouseleave", () => {

    card.style.transform =
      "rotateX(0deg) rotateY(0deg)";

  });

});

</script>
